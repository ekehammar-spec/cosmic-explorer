name: Dagens bild

on:
  schedule:
    # GitHub startar ofta schemalagda jobb flera timmar sent, så första försöket ligger mitt i natten.
    - cron: "17 0 * * *"    # 02.17 svensk sommartid (01.17 vintertid)
    - cron: "43 3 * * *"    # första reserv, 05.43 sommartid
    - cron: "41 9 * * *"    # sista reserv, 11.41 sommartid
  workflow_dispatch:        # kan också startas för hand under fliken Actions

permissions:
  contents: write

# Två körningar får aldrig gå samtidigt. Den andra väntar på sin tur.
concurrency:
  group: dagens-bild
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save sharp
      - run: node scripts/generate.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Spara nya filer
        run: |
          git config user.name "cosmic-bot"
          git config user.email "cosmic-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Dagens bild $(date -u +%F)"
          # Om något laddats upp medan jobbet körde hämtas det först, så att sparningen inte nekas.
          git pull --rebase origin main && git push
